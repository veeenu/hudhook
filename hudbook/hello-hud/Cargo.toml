[package]
name = "hello-hud"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "hello_injector"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]
name = "hello_hud"

[dependencies]
hudhook = { version = "0.9.2", path = "../.." }
imgui = "0.12"
tracing = "0.1.40"
windows = "0.62"
